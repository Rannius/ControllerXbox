name: Kiadási biztonsági mentés

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Telepítőcsomag és GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Forrás letöltése
        uses: actions/checkout@v4

      - name: pnpm beállítása
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Függőségek telepítése
        run: pnpm install --frozen-lockfile

      - name: Frontend fordítása
        run: pnpm run build

      - name: Frontend típusok ellenőrzése
        run: pnpm run check

      - name: Magyar gyűjtemény működésének ellenőrzése
        run: pnpm test

      - name: Backend beállítások és Python 3.8 szintaxis ellenőrzése
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Kiadási verzió ellenőrzése
        run: |
          node -e 'const version = "v" + require("./package.json").version; if (version !== process.env.GITHUB_REF_NAME) { console.error("Verzióeltérés: " + version + " != " + process.env.GITHUB_REF_NAME); process.exit(1); }'

      - name: Decky telepítő ZIP készítése
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          mkdir -p release
          python3 - <<'PY'
          import os
          from copy import copy
          from pathlib import Path
          import struct
          import zipfile

          version = os.environ["VERSION"]
          root = Path("ControllerXbox")
          files = [
              ".gitignore",
              "LICENSE",
              "README.md",
              "main.py",
              "package.json",
              "plugin.json",
              "pnpm-lock.yaml",
              "dist/index.js",
              "dist/index.js.map",
          ]
          output = Path("release") / f"ControllerXbox-v{version}.zip"
          with zipfile.ZipFile("releases/ControllerXbox-v1.0.0.zip") as baseline:
              reference_entries = baseline.infolist()
          assert [entry.filename for entry in reference_entries] == [f"{root}/{relative}" for relative in files]
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for relative, reference in zip(files, reference_entries):
                  info = copy(reference)
                  info.create_system = 0
                  info.create_version = 20
                  info.extract_version = 20
                  info.flag_bits = 0
                  info.external_attr = 0
                  info.compress_type = zipfile.ZIP_DEFLATED
                  archive.writestr(info, Path(relative).read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          data = bytearray(output.read_bytes())
          offset = 0
          while True:
              offset = data.find(b"PK\x01\x02", offset)
              if offset < 0:
                  break
              struct.pack_into("<H", data, offset + 4, 20)
              struct.pack_into("<H", data, offset + 6, 20)
              struct.pack_into("<H", data, offset + 8, 0)
              struct.pack_into("<I", data, offset + 38, 0)
              name_length, extra_length, comment_length = struct.unpack_from("<HHH", data, offset + 28)
              offset += 46 + name_length + extra_length + comment_length
          output.write_bytes(data)
          with zipfile.ZipFile(output) as archive:
              assert archive.namelist() == [f"{root}/{relative}" for relative in files]
              assert archive.namelist() == [entry.filename for entry in reference_entries]
              assert archive.testzip() is None
              for entry, reference in zip(archive.infolist(), reference_entries):
                  for attribute in (
                      "date_time", "compress_type", "create_system", "create_version",
                      "extract_version", "flag_bits", "internal_attr", "external_attr",
                      "extra", "comment",
                  ):
                      assert getattr(entry, attribute) == getattr(reference, attribute), (entry.filename, attribute)
                  assert entry.compress_type == zipfile.ZIP_DEFLATED
                  assert entry.flag_bits == 0
                  assert entry.create_system == 0
                  assert entry.extract_version == 20
                  assert entry.external_attr == 0
          PY

      - name: GitHub Release létrehozása
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "${GITHUB_REF_NAME}" \
              "release/ControllerXbox-${GITHUB_REF_NAME}.zip" \
              --title "Deck Play Badges ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES_FILE"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "release/ControllerXbox-${GITHUB_REF_NAME}.zip" \
            --title "Deck Play Badges ${GITHUB_REF_NAME}" \
            --generate-notes
